# Integration tests for the BFF AppStore (PostgreSQL).
# Runs on every PR and on master pushes that touch web/bff.
# The job uses a throwaway postgres:16 service container; it needs no AWS access.

name: BFF integration tests

on:
  pull_request:
    paths:
      - "web/bff/**"
      - ".github/workflows/integration-tests.yml"
  push:
    branches: [master]
    paths:
      - "web/bff/**"
      - ".github/workflows/integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/bff/package-lock.json

      - name: Install
        working-directory: web/bff
        run: npm ci

      - name: Build
        working-directory: web/bff
        run: npm run build

      - name: Run integration tests
        working-directory: web/bff
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

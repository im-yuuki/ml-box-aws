apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ${name}
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${cluster_name}-karpenter-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${cluster_name}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${cluster_name}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
%{ if kms_key_arn != "" }
        kmsKeyID: "${kms_key_arn}"
%{ endif }
  metadataOptions:
    httpEndpoint: enabled
    httpPutResponseHopLimit: ${hop_limit}
    httpTokens: required

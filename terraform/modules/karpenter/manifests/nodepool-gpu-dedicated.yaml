# gpu-dedicated: 1 user / node / GPU. No sharing, no time-slicing, no MIG.
# Keep capacity (don't scale to 0 if guarantee is needed) — limits are the cost cap.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name}
spec:
  template:
    metadata:
      labels:
        tier: dedicated
        hub.jupyter.org/node-purpose: user # mandatory for Z2JH matchNodePurpose=require
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${nodeclass}
      taints:
        - key: tier
          value: dedicated
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g4dn.xlarge", "g6.xlarge", "g5.xlarge"]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: Never
  limits:
    cpu: 200
    memory: 1000Gi
    nvidia.com/gpu: 20
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m

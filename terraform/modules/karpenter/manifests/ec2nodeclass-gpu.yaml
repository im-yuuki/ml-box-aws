# EC2NodeClass GPU (shared T4 or dedicated). No MIG.
# Fields must be cross-checked against the karpenter-provider-aws release in use (v1 API).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ${name}
spec:
  # Karpenter v1: amiFamily is gone, use amiSelectorTerms. The al2023@latest alias
  # resolves to the right variant (standard for CPU, nvidia for GPU) per instance.
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${cluster_name}-karpenter-node # dedicated NodeInstanceProfile planned for hardening; currently the Karpenter role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${cluster_name}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${cluster_name}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
%{ if kms_key_arn != "" }
        kmsKeyID: "${kms_key_arn}"
%{ endif }
  metadataOptions:
    httpEndpoint: enabled
    httpPutResponseHopLimit: ${hop_limit} # =1 blocks IMDS from pods (§9)
    httpTokens: required
  kubelet:
    maxPods: 110
  # See ec2nodeclass-cpu.yaml for why this userData exists: the AL2023 AMI does not
  # always start nodeadm's units at boot, leaving the node without ECR credentials.
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="==MLBOXBOUNDARY=="

    --==MLBOXBOUNDARY==
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    systemctl start nodeadm-config.service || true
    if ! grep -q image-credential-provider /etc/eks/kubelet/environment 2>/dev/null; then
      systemctl restart containerd || true
      systemctl restart kubelet || true
    fi
    systemctl start --no-block nodeadm-run.service || true

    --==MLBOXBOUNDARY==--

# cpu-user: non-GPU profile. Allows Spot + On-Demand (GPU sessions don't use Spot).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name}
spec:
  template:
    metadata:
      # MANDATORY for Z2JH matchNodePurpose=require: every user pool must have this label,
      # otherwise the placeholder + user pods (affinity) can never be scheduled.
      labels:
        hub.jupyter.org/node-purpose: user
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${nodeclass}
      requirements:
        - key: node.kubernetes.io/instance-category
          operator: In
          values: ["m", "c", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["4"] # Nitro only (m5/c5/r5+); drops legacy Xen that lacks IPv6 options
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: 720h
  limits:
    cpu: 500
    memory: 2000Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

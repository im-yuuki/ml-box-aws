# NodePool shared L4: g6 single-GPU, time-slicing replicas=3 @ 8GB commit.
# Taint tier=shared so dedicated pods don't leak in. Consolidation won't remove nodes with sessions:
# user pods must carry the annotation karpenter.sh/do-not-disrupt=true (hub hook, handoff doc §5).
# expireAfter: set long/turned off for the GPU user pool — verify against the Karpenter release.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ${name}
spec:
  template:
    metadata:
      labels:
        tier: shared
        gpu-family: L4
        hub.jupyter.org/node-purpose: user # mandatory for Z2JH matchNodePurpose=require
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ${nodeclass}
      taints:
        - key: tier
          value: shared
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g6.xlarge", "g6.2xlarge", "g6.4xlarge"]
        - key: karpenter.k8s.aws/instance-gpu-name
          operator: In
          values: ["l4"]
        - key: karpenter.k8s.aws/instance-gpu-count
          operator: In
          values: ["1"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      expireAfter: Never
  limits:
    cpu: 1000
    memory: 4000Gi
    nvidia.com/gpu: 50
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "10%"

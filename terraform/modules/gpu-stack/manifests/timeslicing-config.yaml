# Applies to shared T4 nodes via the label nvidia.com/device-plugin.config=time-slicing-shared.
# replicas=2 @ 8GB commit (T4 16GB, factor 1.0). Increase gradually based on measurements.
# Do NOT apply to the dedicated pool (dedicated nodes don't carry this label -> whole GPU).
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-shared
  namespace: ${namespace}
data:
  # Default for nodes without the label (dedicated pool): no sharing.
  none: |-
    version: v1
  any: |-
    version: v1
    sharing:
      timeSlicing:
        # false: shared nodes keep the name nvidia.com/gpu (time-sliced replicas). Karpenter only
        # knows nvidia.com/gpu, so renamed nvidia.com/gpu.shared made shared pods unschedulable.
        # Isolation between shared and dedicated stays by node taints (tier=shared / tier=dedicated).
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: ${replicas}

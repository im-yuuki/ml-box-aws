# Applies to shared L4 nodes via the label nvidia.com/device-plugin.config=time-slicing-shared.
# replicas=3 @ 8GB commit (L4 24GB, factor 1.0). Increase gradually based on measurements (handoff doc §10).
# Do NOT apply to the dedicated pool (dedicated nodes don't carry this label -> whole GPU).
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-shared
  namespace: gpu-operator-resources
data:
  any: |-
    version: v1
    sharing:
      timeSlicing:
        renameByDefault: true
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: ${replicas}

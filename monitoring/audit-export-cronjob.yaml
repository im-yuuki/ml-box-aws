apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-export
  namespace: dashboard
  labels:
    app: audit-export
    app.kubernetes.io/part-of: mlbox
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: audit-export
        spec:
          restartPolicy: Never
          containers:
            - name: audit-export
              image: ghcr.io/im-yuuki/mlbox-bff:61c5083681579b41140fa98abbeed3d0d1155e9c
              command:
                - node
                - -e
                - |
                  const { Client } = require('pg');
                  (async () => {
                    const c = new Client({
                      connectionString: process.env.USAGE_DATABASE_URL,
                      ssl: { rejectUnauthorized: false },
                    });
                    await c.connect();
                    await c.query(
                      "CREATE TABLE IF NOT EXISTS mlbox_audit_export_state (key text PRIMARY KEY, value text)"
                    );
                    const wm = (
                      await c.query("SELECT value FROM mlbox_audit_export_state WHERE key = 'last_created_at'")
                    ).rows[0]?.value ?? '1970-01-01T00:00:00Z';
                    const rows = (
                      await c.query(
                        'SELECT id, space_id, actor_user_id, action, target, metadata, created_at FROM mlbox_audit_events WHERE created_at > $1 ORDER BY created_at',
                        [wm]
                      )
                    ).rows;
                    for (const r of rows) {
                      console.log(JSON.stringify({ source: 'mlbox_audit_events', ...r }));
                    }
                    if (rows.length > 0) {
                      const last = rows[rows.length - 1].created_at;
                      await c.query(
                        "INSERT INTO mlbox_audit_export_state (key, value) VALUES ('last_created_at', $1) ON CONFLICT (key) DO UPDATE SET value = $1",
                        [last]
                      );
                    }
                    console.log(`AUDIT_EXPORT_DONE count=${rows.length} watermark=${wm}`);
                    await c.end();
                  })().catch((e) => {
                    console.error('AUDIT_EXPORT_FAIL ' + e.message);
                    process.exit(1);
                  });
              env:
                - name: USAGE_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: bff-config
                      key: USAGE_DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi

apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke
  namespace: default
  labels:
    app: gpu-smoke
spec:
  restartPolicy: Never
  nodeSelector: null
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: tier
                operator: In
                values: ["shared"]
  tolerations:
    - key: tier
      operator: Equal
      value: shared
      effect: NoSchedule
  containers:
    - name: gpu-smoke
      image: nvidia/cuda:12.4.1-base-ubuntu22.04
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
